<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Blabry</title>

    <link rel="stylesheet" crossorigin href="/assets/index-CKunhs38.css">

  <body>
    <script>
      /* Antes de qualquer pintura: evita o flash branco ao abrir no tema escuro. */
      (function () {
        try {
          var salvo = localStorage.getItem('tema');
          var escuro = salvo
            ? salvo === 'escuro'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
        } catch (e) {
          document.documentElement.dataset.tema = 'claro';
        }
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
